services:
  postgres:
    image: postgres:16
    container_name: travel-postgres
    restart: unless-stopped
    ports:
      - "5422:5432"
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travelpass
      POSTGRES_DB: travel_guides
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-network

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped
    ports:
      - "6349:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - travel-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      
      # Database
      # Containers can't use .env's DATABASE_URL when it points at localhost.
      # Set DOCKER_DATABASE_URL in .env (e.g. your Supabase URL) to override;
      # otherwise the local postgres container is used.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://travel:travelpass@postgres:5432/travel_guides?sslmode=disable}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Frontend/Backend URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:4000}
      
      # API Keys (from .env)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits to prevent memory issues
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 3G
    
    networks:
      - travel-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: travel-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      
      # Database
      # Containers can't use .env's DATABASE_URL when it points at localhost.
      # Set DOCKER_DATABASE_URL in .env (e.g. your Supabase URL) to override;
      # otherwise the local postgres container is used.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://travel:travelpass@postgres:5432/travel_guides?sslmode=disable}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: travel
      DB_PASSWORD: travelpass
      DB_NAME: travel_guides

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # API Keys
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # Worker needs more resources for document processing
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 3G
    
    networks:
      - travel-network

volumes:
  pgdata:
    driver: local

networks:
  travel-network:
    driver: bridge